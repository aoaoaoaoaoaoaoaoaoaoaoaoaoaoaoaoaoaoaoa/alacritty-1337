name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.1 --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup default 1.97.1
      - run: brew install scdoc
      - run: cargo +1.97.1 test --locked --release --target x86_64-apple-darwin
      - run: make CARGO_PROFILE=release dmg-universal
      - name: Upload application
        run: |
          mv target/release/osx/Alacritty.dmg "Alacritty-${GITHUB_REF_NAME}.dmg"
          .github/workflows/upload_asset.sh "Alacritty-${GITHUB_REF_NAME}.dmg"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: cargo +1.97.1 test --locked --release
      - run: cargo +1.97.1 build --locked --release
      - name: Upload portable executable
        run: |
          cp target/release/alacritty.exe "Alacritty-${GITHUB_REF_NAME}-portable.exe"
          .github/workflows/upload_asset.sh "Alacritty-${GITHUB_REF_NAME}-portable.exe"
      - run: dotnet tool install --global wix --version 4.0.5
      - name: Create MSI installer
        run: |
          wix extension add WixToolset.UI.wixext/4.0.5 WixToolset.Util.wixext/4.0.5
          version=$(python3 -c 'import json, subprocess; data=json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"])); print(next(p["version"] for p in data["packages"] if p["name"] == "alacritty"))')
          wix build -arch x64 -d "ProductVersion=$version" -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -out "Alacritty-${GITHUB_REF_NAME}-installer.msi" alacritty/windows/wix/alacritty.wxs
      - name: Upload MSI installer
        run: .github/workflows/upload_asset.sh "Alacritty-${GITHUB_REF_NAME}-installer.msi"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake libfontconfig1-dev libfreetype6-dev libxcb-xfixes0-dev libxkbcommon-dev pkg-config scdoc
      - run: cargo +1.97.1 test --locked --release
      - name: Generate manpages
        run: |
          scdoc < extra/man/alacritty.1.scd | gzip -9nc > alacritty.1.gz
          scdoc < extra/man/alacritty-msg.1.scd | gzip -9nc > alacritty-msg.1.gz
          scdoc < extra/man/alacritty.5.scd | gzip -9nc > alacritty.5.gz
          scdoc < extra/man/alacritty-bindings.5.scd | gzip -9nc > alacritty-bindings.5.gz
          scdoc < extra/man/alacritty-escapes.7.scd | gzip -9nc > alacritty-escapes.7.gz
      - name: Upload assets
        run: |
          cp extra/logo/alacritty-term.svg Alacritty.svg
          for asset in Alacritty.svg alacritty.1.gz alacritty-msg.1.gz alacritty.5.gz alacritty-bindings.5.gz alacritty-escapes.7.gz extra/completions/alacritty.bash extra/completions/alacritty.fish extra/completions/_alacritty extra/linux/Alacritty.desktop extra/alacritty.info; do
            .github/workflows/upload_asset.sh "$asset"
          done
