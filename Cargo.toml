[workspace]
members = [
    "alacritty",
    "alacritty_terminal",
    "alacritty_config",
    "alacritty_config_derive",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[profile.release]
lto = "thin"
debug = 1
incremental = false

[profile.release-native]
inherits = "release"
codegen-units = 1
debug = 0
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[workspace.dependencies]
toml = "0.9.11"
toml_edit = "0.24.0"

[workspace.lints.rust]
warnings = "deny"
elided_lifetimes_in_paths = "deny"
unexpected_cfgs = "deny"
unused_crate_dependencies = "warn"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_results = "deny"
unsafe_op_in_unsafe_fn = "deny"
ambiguous_glob_imports = "allow"
ambiguous_glob_reexports = "allow"
hidden_glob_reexports = "allow"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -3 }

allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
if_not_else = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

cargo_common_metadata = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"

enum_glob_use = "allow"
wildcard_imports = "allow"

items_after_statements = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
struct_field_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
unnested_or_patterns = "allow"

cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
implicit_hasher = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
uninlined_format_args = "allow"

ignored_unit_patterns = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
no_effect_underscore_binding = "allow"
redundant_closure_for_method_calls = "allow"
ref_option = "allow"
return_self_not_must_use = "allow"
trivially_copy_pass_by_ref = "allow"
unused_async = "allow"
used_underscore_binding = "allow"

# Contextual defaults, protocol-shaped state, and trait-facing methods are deliberate here.
default_trait_access = "allow"
struct_excessive_bools = "allow"
unused_self = "allow"

[workspace.metadata.rust-starter]
format_command = ["cargo", "fmt", "--all", "--", "--check"]
clippy_command = ["cargo", "clippy", "--workspace", "--all-targets", "--all-features", "--locked"]
test_command = ["cargo", "test", "--workspace", "--all-targets", "--all-features", "--locked"]
feature_commands = [
    ["cargo", "test", "--locked", "-p", "alacritty_terminal", "--no-default-features"],
]
linux_feature_commands = [
    ["cargo", "test", "--locked", "-p", "alacritty", "--no-default-features", "--features", "x11"],
    ["cargo", "test", "--locked", "-p", "alacritty", "--no-default-features", "--features", "wayland"],
]
doc_command = ["cargo", "doc", "--workspace", "--all-features", "--no-deps", "--locked"]
canonicalize_commands = [
    ["cargo", "fix", "--workspace", "--all-targets", "--all-features", "--allow-dirty", "--allow-staged", "--allow-no-vcs"],
    ["cargo", "clippy", "--fix", "--workspace", "--all-targets", "--all-features", "--allow-dirty", "--allow-staged", "--allow-no-vcs"],
    ["cargo", "fmt", "--all"],
]

[workspace.metadata.rust-starter.source_files]
max_lines = 3000
include = ["*.rs", "**/*.rs"]
exclude = []

# TODO: Validation of fix for #6978. Remove before next release and use released `x11-clipboard`.
[patch.crates-io]
x11-clipboard = { git = "https://github.com/quininer/x11-clipboard.git", rev = "19ab2163cf0bd0db607e827a5214571990307866" }
