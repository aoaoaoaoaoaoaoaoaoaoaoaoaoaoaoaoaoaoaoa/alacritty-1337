[workspace]
members = [
    "alacritty",
    "alacritty_terminal",
    "alacritty_config",
    "alacritty_config_derive",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[profile.release]
lto = "thin"
debug = 1
incremental = false

[profile.release-native]
inherits = "release"
codegen-units = 1
debug = 0
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[workspace.dependencies]
toml = "0.9.11"
toml_edit = "0.24.0"

[workspace.lints.rust]
warnings = "deny"
elided_lifetimes_in_paths = "deny"
unexpected_cfgs = "deny"
unused_crate_dependencies = "warn"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_results = "deny"
unsafe_op_in_unsafe_fn = "deny"

# House policy: intentional glob vocabularies save tokens; actual ambiguity
# remains a name-resolution error.
ambiguous_glob_imports = "allow"
ambiguous_glob_reexports = "allow"
hidden_glob_reexports = "allow"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -3 }

allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
if_not_else = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

# Result and panic sections would repeat delegated parser, PTY, and invariant semantics.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Two transitive Windows support stacks pin distinct non-runtime target packages.
multiple_crate_versions = "allow"

# House policy: direct and enum-variant glob imports are proper local notation.
enum_glob_use = "allow"
wildcard_imports = "allow"

# Renderer equations conventionally use compact coordinate and channel symbols.
many_single_char_names = "allow"

# Public names retain their domain qualifier when re-exported outside their defining module.
module_name_repetitions = "allow"

# Input, grid, and renderer algorithms use meaningful paired names Clippy conflates.
similar_names = "allow"

# Serialized, CLI, and renderer fields retain role-qualified stable names.
struct_field_names = "allow"

# Large state machines and glyph dispatch tables are clearer with one visible control surface.
too_many_lines = "allow"

# Bounded terminal, pixel, and GL dimensions are projected into narrower ABI widths.
cast_possible_truncation = "allow"

# Signed terminal and GL coordinate projections are bounded by grid and viewport invariants.
cast_possible_wrap = "allow"

# Rendering intentionally projects bounded integer geometry into subpixel floating-point space.
cast_precision_loss = "allow"

# Grid and pixel indices cross signed coordinate APIs only after their domain checks.
cast_sign_loss = "allow"

# Blanket #[must_use] on every pure getter would decorate APIs without clarifying ownership.
must_use_candidate = "allow"

# Type inference already names the exact default target at these construction sites.
default_trait_access = "allow"

# Configuration and protocol booleans are independent axes, not one exclusive state.
struct_excessive_bools = "allow"

# Backend-facing method families retain a uniform receiver grammar across cfg variants.
unused_self = "allow"

[workspace.metadata.rust-starter]
format_command = ["cargo", "fmt", "--all", "--", "--check"]
clippy_command = ["cargo", "clippy", "--workspace", "--all-targets", "--all-features", "--locked"]
test_command = ["cargo", "test", "--workspace", "--all-targets", "--all-features", "--locked"]
feature_commands = [
    ["cargo", "test", "--locked", "-p", "alacritty_terminal", "--no-default-features"],
]
linux_feature_commands = [
    ["cargo", "test", "--locked", "-p", "alacritty-1337", "--no-default-features", "--features", "x11"],
    ["cargo", "test", "--locked", "-p", "alacritty-1337", "--no-default-features", "--features", "wayland"],
]
doc_command = ["cargo", "doc", "--workspace", "--all-features", "--no-deps", "--locked"]
canonicalize_commands = [
    ["cargo", "fix", "--workspace", "--all-targets", "--all-features", "--allow-dirty", "--allow-staged", "--allow-no-vcs"],
    ["cargo", "clippy", "--fix", "--workspace", "--all-targets", "--all-features", "--allow-dirty", "--allow-staged", "--allow-no-vcs"],
    ["cargo", "fmt", "--all"],
]

[workspace.metadata.rust-starter.source_files]
max_lines = 3000
include = ["*.rs", "**/*.rs"]
exclude = []

# crates.io 0.9.3 still lacks the selection-ownership fix from upstream issue #6978.
# Keep the exact upstream commit until a release containing it is selected.
[patch.crates-io]
x11-clipboard = { git = "https://github.com/quininer/x11-clipboard.git", rev = "19ab2163cf0bd0db607e827a5214571990307866" }
